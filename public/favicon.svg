<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#74BDE3" />
      <stop offset="100%" stop-color="#4F91C7" />
    </linearGradient>
    <linearGradient id="pinkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8A4BA" />
      <stop offset="100%" stop-color="#B72C5E" />
    </linearGradient>
    <radialGradient id="holeDepth" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#243B53" stop-opacity="0.95" />
      <stop offset="60%" stop-color="#4F91C7" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#74BDE3" stop-opacity="0" />
    </radialGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Portal Rings -->
  <ellipse cx="50" cy="54" rx="42" ry="34" fill="url(#skyGrad)" opacity="0.18" />
  <ellipse cx="50" cy="54" rx="34" ry="27" fill="url(#skyGrad)" opacity="0.3" />
  <ellipse cx="50" cy="54" rx="26" ry="20" fill="url(#skyGrad)" opacity="0.6" />
  <ellipse cx="50" cy="54" rx="18" ry="14" fill="#4F91C7" opacity="0.9" />
  <ellipse cx="50" cy="54" rx="11" ry="8" fill="#243B53" />

  <!-- Rabbit Ears emerging from hole -->
  <!-- Left Ear -->
  <path d="M 39 52 C 34 38, 30 18, 38 12 C 45 6, 47 22, 45 48 Z" fill="url(#skyGrad)" />
  <path d="M 38 46 C 36 34, 33 22, 38 17 C 42 12, 44 24, 42 44 Z" fill="url(#pinkGrad)" opacity="0.9" />

  <!-- Right Ear with playful tip bend -->
  <path d="M 52 48 C 50 24, 53 10, 61 14 C 68 18, 64 34, 59 52 Z" fill="url(#skyGrad)" />
  <path d="M 54 44 C 53 26, 55 17, 60 20 C 64 23, 62 34, 58 46 Z" fill="url(#pinkGrad)" opacity="0.9" />

  <!-- Sparkle of curiosity -->
  <path d="M 68 28 Q 72 28 72 24 Q 72 28 76 28 Q 72 28 72 32 Q 72 28 68 28 Z" fill="#B72C5E" filter="url(#softGlow)" />
  <circle cx="28" cy="38" r="2.5" fill="#E8A4BA" />
  <circle cx="73" cy="46" r="2" fill="#74BDE3" />
</svg>